# Install once, in the repo folder, with the conda environment master active:
#
#     pip install -e ".[test]"
#
# This also installs the libraries in requirements.txt, and pytest and fmpy for
# the tests in tests/ (leave out [test] if you only run the simulation).

[build-system]
# setuptools 77 or newer for the SPDX license field (PEP 639).
requires = ["setuptools>=77", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ospfmusim"
authors = [
  { name="Olve Grønås Birkeland", email="olvebirkeland@icloud.com" },
  { name="William Boland", email="williamboland1112@gmail.com" },
]
description = "DP co-simulation of vessels with Python FMUs in OSP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# The project license, and the GPL-3.0-or-later license and notice of the
# hull calculation modules in hull/helpfunctions/ (see NOTICE.md there).
license-files = [
    "LICENSE",
    "src/ospfmusim/hull/helpfunctions/LICENSE",
    "src/ospfmusim/hull/helpfunctions/NOTICE.md",
]
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "fmpy>=0.3.32,<0.4",   # tests/test_vessel_fmu.py: runs the built VesselBlock FMU
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux"
]

keywords = ["dynamic positioning", "co-simulation", "fmu", "osp", "marine", "vessel"]

[project.urls]
Homepage = "https://github.com/Olvegb/ospdpsimpy"
Repository = "https://github.com/Olvegb/ospdpsimpy.git"
Documentation = "https://github.com/Olvegb/ospdpsimpy/tree/main/docs"
Issues = "https://github.com/Olvegb/ospdpsimpy/issues"
Source = "https://github.com/Olvegb/ospdpsimpy"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# requirements.txt is the one list of libraries; comments in it are ignored.
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
# Files that are not .py but are needed: the system structure, the hull data,
# and the license and notice of the hull modules.
ospfmusim = [
    "OspSystemStructure.xml",
    "hull/helpfunctions/*.json",
    "hull/helpfunctions/LICENSE",
    "hull/helpfunctions/NOTICE.md",
]

[tool.pytest.ini_options]
# python -m pytest runs every test in tests/. src/ is put on the path, so the
# tests also run without pip install -e .
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools_scm]
# Basic setuptools-scm config: derive version from git tags.
# No write_to/version_file needed; importlib.metadata reads dist metadata.
version_scheme = 'post-release'
